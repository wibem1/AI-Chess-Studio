name: Chess Studio 1.5 – verify strategy branch (no deployment)
on:
  workflow_dispatch:
  push:
    branches:
      - feat/human-strategic-analysis-1-5
    paths:
      - .github/workflows/chessstudio-1-5-verify.yml
      - src/**
      - test/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: "true"
      CHESS_ENABLE_PAID_API: "0"
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run check
      - name: Compile and run full Node test suite
        run: npm test
      - name: Build web app without publishing
        run: npm run build:pages
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Focused browser regressions (no deployment, bounded)
        timeout-minutes: 6
        run: npx playwright test e2e/stockfish-assist.spec.ts e2e/coach-tools.spec.ts e2e/game-review.spec.ts e2e/rejected-ai-request.spec.ts --timeout=20000 --global-timeout=300000 --workers=1
