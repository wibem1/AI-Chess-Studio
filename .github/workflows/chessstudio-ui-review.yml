name: ChessStudio Sol Responses transport and tools (no deployment)
on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - .github/workflows/chessstudio-ui-review.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      CHESS_ENABLE_PAID_API: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run build:pages
      - run: npx playwright test e2e/provider-recovery.spec.ts e2e/simplified-workflow.spec.ts e2e/stable-toolbar.spec.ts e2e/pgn-file.spec.ts e2e/position-transfer.spec.ts
